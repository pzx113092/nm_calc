<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isotope Activity Calculator</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #d8dee4;
      --text: #17202a;
      --muted: #66727e;
      --primary: #1769aa;
      --danger: #b42318;
      --success-bg: #e9f7ef;
      --success-border: #9bd4af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: min(1000px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.8rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #b9c2ca;
      border-radius: 6px;
      background: white;
    }

    input:disabled,
    select:disabled {
      background: #eef1f3;
      color: #66727e;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 13px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    button.secondary {
      background: #596773;
    }

    button.danger {
      background: var(--danger);
    }

    button:hover {
      filter: brightness(0.95);
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inline input[type="checkbox"] {
      width: auto;
    }

    .activity-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 8px;
    }

    .global-activity {
      margin-top: 14px;
      padding: 12px;
      background: #f7f9fa;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .global-activity .activity-row {
      max-width: 420px;
      margin-top: 8px;
    }

    #containers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .container-card {
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      border-radius: 8px;
      padding: 15px;
      background: white;
    }

    .container-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .container-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .result {
      margin-top: 14px;
      padding: 12px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: 7px;
    }

    .result strong {
      display: block;
      font-size: 1.15rem;
      margin-top: 3px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .warning {
      color: #8a4b00;
      font-size: 0.88rem;
      margin-top: 8px;
    }

    footer {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .grid,
      .activity-row {
        grid-template-columns: 1fr;
      }

      .container-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Isotope Activity Calculator</h1>

    <section class="card">
      <h2>Calculation settings</h2>

      <div class="grid">
        <div class="field">
          <label for="isotope">Isotope</label>
          <select id="isotope">
            <option value="Tc-99m">99mTc — 6.0067 h</option>
            <option value="F-18">18F — 109.77 min</option>
            <option value="I-123">123I — 13.223 h</option>
            <option value="I-131">131I — 8.0252 d</option>
            <option value="Ga-68">68Ga — 67.71 min</option>
            <option value="Lu-177">177Lu — 6.647 d</option>
            <option value="Ra-223">223Ra — 11.435 d</option>
          </select>
        </div>

        <div class="field">
          <label for="calibrationTime">Calibration time</label>
          <input id="calibrationTime" type="datetime-local" />
        </div>
      </div>

      <div class="inline" style="margin-top: 12px;">
        <input id="useNow" type="checkbox" checked />
        <label for="useNow">Use current time and update automatically</label>
      </div>

      <div class="global-activity">
        <div class="inline">
          <input id="sameTarget" type="checkbox" />
          <label for="sameTarget">
            Use the same target activity in every container
          </label>
        </div>

        <div class="activity-row">
          <input
            id="globalTargetAmount"
            type="number"
            min="0"
            step="any"
            value="1"
            disabled
          />
          <select id="globalTargetUnit" disabled>
            <option value="Bq">Bq</option>
            <option value="kBq">kBq</option>
            <option value="MBq">MBq</option>
            <option value="GBq">GBq</option>
            <option value="mCi" selected>mCi</option>
            <option value="Ci">Ci</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button id="addContainer">Add entry</button>
      </div>
    </section>

    <section class="card">
      <div id="containers"></div>
    </section>

    <footer>
      Formula:
      calibration activity = target activity ×
      2<sup>(target time − calibration time) / half-life</sup>.

    </footer>
  </main>

  <script>
    const isotopes = {
      "Tc-99m": {
        label: "99mTc",
        halfLifeHours: 6.0067
      },
      "F-18": {
        label: "18F",
        halfLifeHours: 109.77 / 60
      },
      "I-123": {
        label: "123I",
        halfLifeHours: 13.223
      },
      "I-131": {
        label: "131I",
        halfLifeHours: 8.0252 * 24
      },
      "Ga-68": {
        label: "68Ga",
        halfLifeHours: 67.71 / 60
      },
      "Lu-177": {
        label: "177Lu",
        halfLifeHours: 6.647 * 24
      },
      "Ra-223": {
        label: "223Ra",
        halfLifeHours: 11.435 * 24
      }
    };

    const unitFactorsToBq = {
      Bq: 1,
      kBq: 1e3,
      MBq: 1e6,
      GBq: 1e9,
      mCi: 3.7e7,
      Ci: 3.7e10
    };

    let containers = [];
    let nextId = 1;

    const isotopeSelect = document.getElementById("isotope");
    const calibrationTimeInput = document.getElementById("calibrationTime");
    const useNowCheckbox = document.getElementById("useNow");
    const sameTargetCheckbox = document.getElementById("sameTarget");
    const globalTargetAmount = document.getElementById("globalTargetAmount");
    const globalTargetUnit = document.getElementById("globalTargetUnit");
    const containersElement = document.getElementById("containers");

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function dateToLocalInputValue(date) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-") + "T" + [
        pad(date.getHours()),
        pad(date.getMinutes())
      ].join(":");
    }

    function formatDateTime(date) {
      return date.toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getCalibrationDate() {
      if (useNowCheckbox.checked) {
        return new Date();
      }

      const value = calibrationTimeInput.value;
      return value ? new Date(value) : null;
    }

    function formatActivity(value) {
      if (!Number.isFinite(value) || value < 0) {
        return "—";
      }

      if (value === 0) {
        return "0";
      }

      if (Math.abs(value) >= 1000 || Math.abs(value) < 0.01) {
        return value.toExponential(4);
      }

      return value.toLocaleString(undefined, {
        maximumFractionDigits: 6
      });
    }

    function convertToBq(amount, unit) {
      return Number(amount) * unitFactorsToBq[unit];
    }

    function convertFromBq(amountBq, unit) {
      return amountBq / unitFactorsToBq[unit];
    }

    function getTargetActivityBq(container) {
      const amount = sameTargetCheckbox.checked
        ? globalTargetAmount.value
        : container.targetAmount;

      const unit = sameTargetCheckbox.checked
        ? globalTargetUnit.value
        : container.targetUnit;

      return convertToBq(amount, unit);
    }

    function calculateCalibrationActivity(container) {
      const calibrationDate = getCalibrationDate();
      const targetDate = new Date(container.targetTime);

      if (!calibrationDate || Number.isNaN(targetDate.getTime())) {
        return null;
      }

      const targetActivityBq = getTargetActivityBq(container);
      const halfLifeHours = isotopes[isotopeSelect.value].halfLifeHours;
      const timeDifferenceHours =
        (targetDate.getTime() - calibrationDate.getTime()) / 3600000;

      return targetActivityBq *
        Math.pow(2, timeDifferenceHours / halfLifeHours);
    }

    function addContainer() {
      const target = new Date(Date.now() + 60 * 60 * 1000);

      containers.push({
        id: nextId++,
        label: "",
        targetAmount: 1,
        targetUnit: "mCi",
        targetTime: dateToLocalInputValue(target)
      });

      render();
    }

    function deleteContainer(id) {
      containers = containers.filter(container => container.id !== id);
      render();
    }

    function updateContainer(id, property, value) {
      const container = containers.find(item => item.id === id);

      if (!container) {
        return;
      }

      container[property] = value;
      render();
    }

    function render() {
      containers.sort((a, b) =>
        new Date(a.targetTime) - new Date(b.targetTime)
      );

      containersElement.innerHTML = "";

      if (containers.length === 0) {
        containersElement.innerHTML = `
          <div class="empty">
            No entries yet. Select “Add entry” to begin.
          </div>
        `;
        return;
      }

      containers.forEach((container, index) => {
        const isotope = isotopes[isotopeSelect.value];
        const calibrationActivityBq =
          calculateCalibrationActivity(container);

        const displayUnit = sameTargetCheckbox.checked
          ? globalTargetUnit.value
          : container.targetUnit;

        const displayCalibrationActivity =
          calibrationActivityBq === null
            ? "—"
            : `${formatActivity(
                convertFromBq(calibrationActivityBq, displayUnit)
              )} ${displayUnit}`;

        const targetDate = new Date(container.targetTime);
        const calibrationDate = getCalibrationDate();

        let warning = "";

        if (calibrationDate && targetDate < calibrationDate) {
          warning = `
            <div class="warning">
              Target time is before the calibration time. The calculated
              calibration activity is lower than the target activity.
            </div>
          `;
        }

        const card = document.createElement("article");
        card.className = "container-card";

        card.innerHTML = `
          <div class="container-header">
            <div class="container-title">
              Entry ${index + 1}
              ${container.label ? `— ${escapeHtml(container.label)}` : ""}
            </div>

            <button class="danger" data-action="delete">
              Delete
            </button>
          </div>

          <div class="grid">
            <div class="field">
              <label>Name</label>
              <input
                type="text"
                data-property="label"
                value="${escapeAttribute(container.label)}"
                placeholder="e.g. Patient A"
              />
            </div>

            <div class="field">
              <label>Target time</label>
              <input
                type="datetime-local"
                data-property="targetTime"
                value="${escapeAttribute(container.targetTime)}"
              />
            </div>
          </div>

          <div class="field" style="margin-top: 14px;">
            <label>Target activity</label>
            <div class="activity-row">
              <input
                type="number"
                min="0"
                step="any"
                data-property="targetAmount"
                value="${escapeAttribute(
                  sameTargetCheckbox.checked
                    ? globalTargetAmount.value
                    : container.targetAmount
                )}"
                ${sameTargetCheckbox.checked ? "disabled" : ""}
              />

              <select
                data-property="targetUnit"
                ${sameTargetCheckbox.checked ? "disabled" : ""}
              >
                ${activityUnitOptions(
                  sameTargetCheckbox.checked
                    ? globalTargetUnit.value
                    : container.targetUnit
                )}
              </select>
            </div>
          </div>

          <div class="result">
            Required activity at calibration time:
            <strong>${displayCalibrationActivity}</strong>
            <div class="muted">
              ${calibrationDate
                ? `Based on calibration time: ${formatDateTime(calibrationDate)}`
                : "Set a valid calibration time"}
            </div>
            ${warning}
          </div>
        `;

        card.querySelector('[data-action="delete"]')
          .addEventListener("click", () => deleteContainer(container.id));

        card.querySelectorAll("[data-property]").forEach(input => {
        const property = input.dataset.property;

        // Update the object while typing, but do not rebuild the DOM.
        input.addEventListener("input", event => {
            const currentContainer = containers.find(
              item => item.id === container.id
            );

            if (currentContainer) {
              currentContainer[property] = event.target.value;
            }
          });

          // Recalculate and rerender after editing is finished.
          input.addEventListener("change", event => {
            updateContainer(container.id, property, event.target.value);
          });
        });

        containersElement.appendChild(card);
      });
    }

    function activityUnitOptions(selectedUnit) {
      return Object.keys(unitFactorsToBq)
        .map(unit => `
          <option value="${unit}" ${unit === selectedUnit ? "selected" : ""}>
            ${unit}
          </option>
        `)
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value ?? "");
    }

    document.getElementById("addContainer")
      .addEventListener("click", addContainer);

    isotopeSelect.addEventListener("change", render);

    useNowCheckbox.addEventListener("change", () => {
      calibrationTimeInput.disabled = useNowCheckbox.checked;

      if (!useNowCheckbox.checked && !calibrationTimeInput.value) {
        calibrationTimeInput.value = dateToLocalInputValue(new Date());
      }

      render();
    });

    calibrationTimeInput.addEventListener("input", render);
    calibrationTimeInput.addEventListener("change", render);

    sameTargetCheckbox.addEventListener("change", () => {
      globalTargetAmount.disabled = !sameTargetCheckbox.checked;
      globalTargetUnit.disabled = !sameTargetCheckbox.checked;
      render();
    });

    globalTargetAmount.addEventListener("input", () => {
  // Do not call render while typing.
  // The current value is read directly by getTargetActivityBq().
    });

    globalTargetAmount.addEventListener("change", render);
    globalTargetUnit.addEventListener("change", render);

    // Update current time and results at least once per minute.
    setInterval(() => {
      if (useNowCheckbox.checked) {
        render();
      }
    }, 60000);

    // Initialize calibration time and add one example container.
    calibrationTimeInput.value = dateToLocalInputValue(new Date());
    calibrationTimeInput.disabled = true;
    addContainer();
  </script>
</body>
</html>
